description: |
  The request did not include a valid bearer JWT, or the JWT was expired,
  malformed, or referenced a user that Firebase no longer recognises.
content:
  application/json:
    schema:
      $ref: "../schemas/ErrorResponse.yaml"
    examples:
      missingHeader:
        summary: Authorization header missing
        value:
          detail: "Missing or invalid authorization header"
      expiredToken:
        summary: JWT has expired
        value:
          detail: "Token has expired"
      invalidToken:
        summary: JWT signature invalid
        value:
          detail: "Invalid token"
      missingEmail:
        summary: JWT payload missing email claim
        value:
          detail: "Token payload missing email"
