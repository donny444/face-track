## nginx config for the mock Next.js web service used in smoke tests.
## Serves a tiny static site that includes the marker `WEB_OK` so the
## tester can assert nginx routed `/` to the web upstream.

events {}

http {
    server {
        listen 3000;

        # Catch-all that returns WEB_OK. Covers /, /_next/static/...,
        # /icons/..., /fonts/..., /favicon.ico, and every SPA deep link.
        location / {
            default_type text/plain;
            return 200 "WEB_OK\n";
        }

        # Explicit favicon location returns 200 with a known body so
        # nginx-in-front-of-this won't confuse a 404 for a routing
        # problem.
        location = /favicon.ico {
            default_type text/plain;
            return 200 "WEB_OK favicon\n";
        }
    }
}
