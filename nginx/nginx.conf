## nginx/nginx.conf
## Top-level Nginx configuration for the FaceTrack reverse proxy.
## Routes traffic between the Next.js client (web:3000) and the
## FastAPI server (server:8000). See conf.d/*.conf for the actual
## server blocks and upstream definitions.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Performance / connection handling
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # Allow face image uploads up to ~10 MB
    client_max_body_size 10M;

    # Hide the nginx version in error pages and the Server header
    server_tokens off;

    # --- Logging ----------------------------------------------------------
    # Standard combined format
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    # JSON variant for easy ingestion into log pipelines
    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"request":"$request",'
            '"status":$status,'
            '"body_bytes_sent":$body_bytes_sent,'
            '"referer":"$http_referer",'
            '"user_agent":"$http_user_agent",'
            '"request_time":$request_time,'
            '"upstream_addr":"$upstream_addr",'
            '"upstream_response_time":"$upstream_response_time"'
        '}';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # --- Compression ------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    # --- Proxy defaults ---------------------------------------------------
    # Shared by all proxy_pass directives. Individual locations can
    # override these as needed.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Empty Connection header is required to allow keepalive to the upstream
    proxy_set_header Connection        "";
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_connect_timeout 5s;

    # Load upstreams and server blocks
    include /etc/nginx/conf.d/*.conf;
}
