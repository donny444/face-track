## nginx/conf.d/upstreams.conf
## Upstream pools for the FaceTrack reverse proxy.
##
## Production: this file targets Docker Compose service names `web`
## (Next.js client) and `server` (FastAPI). Both keep a small pool of
## idle keepalive connections to reduce per-request latency.
##
## Local non-Docker testing override:
##   To run nginx on the host against `next start` and `uvicorn`
##   running on 127.0.0.1, drop in a file with the same upstream names
##   (e.g. /etc/nginx/conf.d/upstreams.local.conf) AFTER renaming this
##   one out of the way, or edit these `server` directives to:
##     server 127.0.0.1:3000;
##     server 127.0.0.1:8000;

upstream facetrack_web {
    server web:3000;
    keepalive 16;
}

upstream facetrack_api {
    server server:8000;
    keepalive 16;
}
