## nginx/conf.d/tls.conf
## TLS stub for FaceTrack. Disabled by default.
##
## How to enable:
##   1. Obtain certificates and mount them into the nginx container at:
##        /etc/nginx/certs/fullchain.pem
##        /etc/nginx/certs/privkey.pem
##      Use Let's Encrypt via certbot, an ACME client, or your CA of
##      choice. For local development, `mkcert` works well.
##
##   2. Uncomment the server block below.
##
##   3. In conf.d/default.conf, replace `listen 80 default_server;` with
##        listen 80 default_server;
##        return 301 https://$host$request_uri;
##      (or move the entire routing block into this file under listen 443
##      to terminate TLS here.)
##
##   4. Enable HSTS in conf.d/default.conf (the line marked TODO).
##
## ACME HTTP-01 challenge:
##   If using certbot-nginx or an ACME sidecar, add:
##     location /.well-known/acme-challenge/ {
##         root /var/www/certbot;
##     }
##   to the port-80 server block before the 301 redirect.

