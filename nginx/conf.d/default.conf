## nginx/conf.d/default.conf
## Main HTTP server block for FaceTrack.
##
## Route map:
##   /healthz              -> served directly by nginx (200 "ok")
##   /api/*                -> FastAPI (server:8000), strips the /api prefix
##                            so /api/attendances/ hits /attendances/
##                            (also covers /api/docs, /api/redoc,
##                            /api/openapi.json by virtue of the prefix
##                            strip)
##   /faces/*              -> FastAPI static mount (path preserved)
##   /_next/static/*       -> Next.js hashed assets, cached aggressively
##   /favicon.ico, /icons/, /fonts/  -> Next.js, short browser cache
##   /                     -> Next.js SPA (catch-all)

server {
    listen 80 default_server;
    server_name _;

    # --- Security headers -------------------------------------------------
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(self), microphone=(), geolocation=(), interest-cohort=()" always;
    # TODO: enable HSTS once TLS termination is in place (see tls.conf)
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # --- Health check (served by nginx itself) ----------------------------
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # --- FastAPI: REST API + /docs, /redoc, /openapi.json -----------------
    # The trailing slash on `proxy_pass http://facetrack_api/;` is what
    # strips the /api prefix. /api/attendances/ -> /attendances/ upstream.
    # This also handles /api/docs, /api/redoc, /api/openapi.json.
    #
    # Caveat: FastAPI's default /docs HTML references /openapi.json
    # relative to the root, not /api/openapi.json. If you need
    # browser-rendered docs through this proxy, either configure FastAPI
    # with `FastAPI(docs_url="/docs", openapi_url="/openapi.json",
    # root_path="/api")`, or add a dedicated `/openapi.json` location.
    location /api/ {
        proxy_pass http://facetrack_api/;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
    }

    # --- FastAPI static face image mount ---------------------------------
    # No trailing slash on proxy_pass so the full /faces/<file> URI is
    # preserved when forwarded upstream.
    location /faces/ {
        proxy_pass http://facetrack_api;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
    }

    # --- Next.js hashed static assets ------------------------------------
    # Content under /_next/static/ is content-hashed by Next.js, so it is
    # safe to cache for a full year and treat as immutable.
    location /_next/static/ {
        proxy_pass http://facetrack_web;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";

        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, immutable, max-age=31536000" always;
    }

    # --- Other static assets served by the Next.js app -------------------
    # favicon, icon set, and font files - short browser cache.
    location = /favicon.ico {
        proxy_pass http://facetrack_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        add_header Cache-Control "public, max-age=3600" always;
        access_log off;
    }

    location /icons/ {
        proxy_pass http://facetrack_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        add_header Cache-Control "public, max-age=3600" always;
    }

    location /fonts/ {
        proxy_pass http://facetrack_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        add_header Cache-Control "public, max-age=3600" always;
    }

    # --- SPA catch-all ---------------------------------------------------
    # Everything else falls through to the Next.js server. The Next.js
    # router handles client-side navigation; full reloads of deep links
    # are also served by `next start` directly.
    location / {
        proxy_pass http://facetrack_web;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";

        # Support Server-Sent Events / streaming responses if Next.js
        # introduces them later.
        proxy_buffering off;
    }
}
