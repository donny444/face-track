# Minimal reverse-proxy for the FaceTrack stack.
#
# The dedicated `nginx-conf` branch will ship a comprehensive config
# (gzip, caching, TLS termination, rate limits, etc.). This file just
# wires the docker-compose topology together so the stack is usable
# end-to-end on a developer machine.

upstream facetrack_web {
    server web:3000;
}

upstream facetrack_api {
    server server:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 16M;

    # API: strip the /api prefix before forwarding to FastAPI.
    location /api/ {
        proxy_pass         http://facetrack_api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Everything else goes to the Next.js app.
    location / {
        proxy_pass         http://facetrack_web;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
